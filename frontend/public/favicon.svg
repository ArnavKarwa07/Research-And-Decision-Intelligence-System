<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#19120a"/>
  <!-- Radar concentric circles -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#534434" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#534434" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="8" fill="none" stroke="#534434" stroke-width="1.5"/>
  <!-- Crosshairs -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="#534434" stroke-width="1.5"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#534434" stroke-width="1.5"/>
  <!-- Radar sweep segment -->
  <path d="M 32 32 L 32 8 A 24 24 0 0 1 56 32 Z" fill="url(#radar-sweep)" opacity="0.6"/>
  <!-- Sweep line -->
  <line x1="32" y1="32" x2="56" y2="32" stroke="#ffc174" stroke-width="2"/>
  <!-- Target blip -->
  <circle cx="44" cy="20" r="2.5" fill="#ffc174"/>
  <circle cx="44" cy="20" r="4.5" fill="none" stroke="#ffc174" stroke-width="1" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2" fill="#ffc174"/>
  <defs>
    <radialGradient id="radar-sweep" cx="100%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#ffc174" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffc174" stop-opacity="0.0"/>
    </radialGradient>
  </defs>
</svg>